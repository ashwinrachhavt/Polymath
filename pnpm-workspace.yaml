# pnpm 12 blocks lifecycle scripts by default; this is the allowlist.
# Each entry earns its place: esbuild ships a platform binary that must be
# installed by its own postinstall, or drizzle-kit cannot run.
allowBuilds:
  '@clerk/shared': false
  # Optional natives of just-bash (a dev-only sandbox provider); the package
  # works without them, so the scripts are declined rather than approved.
  '@mongodb-js/zstd': false
  'node-liblzma': false
  esbuild: true
  sharp: false
  unrs-resolver: false

# Security pins for transitive chains whose direct requesters hold exact (or
# 0.x-caret) ranges excluding every patched release. Each selector only fires
# while the resolved version is vulnerable and goes inert once upstream bumps
# past it — that is the standing removal condition. Path, range check, and
# per-line removal condition: docs/dependency-overrides.md
overrides:
  'undici@>=7.0.0 <7.30.1': '7.30.1'
  'undici@>=8.0.0 <8.12.2': '8.12.2'
  'nanoid@>=3.0.0 <3.3.18': '3.3.20'
  'nanoid@>=4.0.0 <5.1.16': '5.1.16'
  'lodash-es@>=4.0.0 <4.18.1': '4.18.1'
  'katex@>=0.11.0 <0.18.2': '0.18.2'
  'esbuild@~0.18.20': '0.25.12'
  'zod@>=4.0.0 <4.6.6': '4.6.7'
