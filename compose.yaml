# Local development stack. One command:
#
#   make up
#
# `make up` starts infra (Postgres, docling, search, Langfuse), runs pending
# migrations, and starts the Next.js web app plus the outbox worker in Docker.
# No separate commands for queue, dev, or stack.
#
# The same Postgres 17 engine and extension set as prod Neon is used
# (vector, pg_trgm, citext, pgcrypto — see src/db/migrations/0000_extensions.sql).
#
# The axiom_test database is created on first boot for integration suites
# (TEST_DATABASE_URL). The suite truncates it before running — never point
# TEST_DATABASE_URL at the app database.
#
# Docling: the extraction provider for development. First run pulls ~2GB of
# models. The deployed Vercel app cannot reach this container.

x-app-env: &app-env # In-container service discovery (overrides localhost values from env files).
  DATABASE_URL: postgresql://axiom:axiom@db:5432/axiom
  DOCLING_SERVE_URL: http://docling:5001
  HEADROOM_BASE_URL: http://headroom:8787
  SEARXNG_URL: http://searxng:8080
  FIRECRAWL_API_URL: http://firecrawl:3002
  # Langfuse runs as the companion compose project (make up starts it). From
  # containers on the default bridge, reach the host-published Langfuse port.
  LANGFUSE_BASE_URL: ${LANGFUSE_BASE_URL:-http://host.docker.internal:3100}
  LANGFUSE_PUBLIC_KEY: ${LANGFUSE_PUBLIC_KEY:-pk-lf-polymath-local}
  LANGFUSE_SECRET_KEY: ${LANGFUSE_SECRET_KEY:-sk-lf-polymath-local}
  POLYMATH_GATEWAY_URL: ${POLYMATH_GATEWAY_URL:-http://web:3000}
  NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-http://localhost:3000}
  # Reliable file watching on macOS bind mounts.
  WATCHPACK_POLLING: "true"
  CHOKIDAR_USEPOLLING: "true"

x-app-service: &app-service
  build:
    context: .
    dockerfile: Dockerfile
  image: axiom-dev:local
  working_dir: /app
  entrypoint: ["/bin/sh", "/app/docker/entrypoint.sh"]
  env_file:
    - path: .env
      required: false
    - path: .env.local
      required: false
  volumes:
    - .:/app
    - app_node_modules:/app/node_modules
    - app_next:/app/.next
  extra_hosts:
    - "host.docker.internal:host-gateway"
  networks:
    - default
    - search

services:
  db:
    image: pgvector/pgvector:pg17
    ports:
      - "127.0.0.1:5432:5432"
    environment:
      POSTGRES_DB: axiom
      POSTGRES_USER: axiom
      POSTGRES_PASSWORD: axiom
    volumes:
      - axiom-pgdata:/var/lib/postgresql/data
      - ./scripts/initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U axiom -d axiom"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  migrate:
    <<: *app-service
    environment:
      <<: *app-env
    command: ["pnpm", "db:migrate"]
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  web:
    <<: *app-service
    environment:
      <<: *app-env
      HOSTNAME: "0.0.0.0"
      PORT: "3000"
    command: ["pnpm", "dev", "--hostname", "0.0.0.0", "--port", "3000"]
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      docling:
        condition: service_started
    restart: unless-stopped

  worker:
    <<: *app-service
    environment:
      <<: *app-env
    command: ["pnpm", "exec", "tsx", "scripts/outbox-worker.ts"]
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

  docling:
    image: quay.io/docling-project/docling-serve
    ports:
      - "127.0.0.1:5001:5001"
    restart: unless-stopped

  # Headroom: compresses LLM context before it leaves this machine. The deployed
  # Vercel app cannot reach this container. No host port is published: the
  # dockerized app reaches it at http://headroom:8787 on the compose network,
  # avoiding conflicts with any local process already using 8787.
  headroom:
    image: ghcr.io/headroomlabs-ai/headroom
    container_name: axiom-headroom
    command: ["--host", "0.0.0.0", "--port", "8787"]
    environment:
      HEADROOM_ALLOW_UNAUTHENTICATED_BIND: "1"
    healthcheck:
      test: ["CMD-SHELL", "curl --fail --silent http://127.0.0.1:8787/readyz"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    restart: unless-stopped

  # Private metasearch for the agents' web.search tool and Firecrawl.
  searxng:
    image: searxng/searxng:latest
    container_name: axiom-searxng
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      SEARXNG_BASE_URL: "http://127.0.0.1:8080/"
    volumes:
      - ./scripts/local-search/searxng/settings.yml:/etc/searxng/settings.yml:ro
    depends_on:
      redis-search:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/healthz >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    restart: unless-stopped
    networks:
      - search

  redis-search:
    image: redis:alpine
    container_name: axiom-redis-search
    command: redis-server --bind 0.0.0.0 --save "" --appendonly no
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped
    networks:
      - search

  firecrawl:
    image: ghcr.io/firecrawl/firecrawl:latest
    container_name: axiom-firecrawl
    ports:
      - "127.0.0.1:3002:3002"
    environment:
      HOST: "0.0.0.0"
      PORT: "3002"
      ENV: local
      REDIS_URL: redis://redis-search:6379
      REDIS_RATE_LIMIT_URL: redis://redis-search:6379
      PLAYWRIGHT_MICROSERVICE_URL: http://firecrawl-playwright:3000/scrape
      POSTGRES_HOST: firecrawl-postgres
      POSTGRES_PORT: "5432"
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
      USE_DB_AUTHENTICATION: "false"
      NUQ_RABBITMQ_URL: amqp://firecrawl-rabbitmq:5672
      SEARXNG_ENDPOINT: http://searxng:8080
      SEARXNG_ENGINES: duckduckgo,brave
      SEARXNG_CATEGORIES: general
      NUM_WORKERS_PER_QUEUE: "4"
      CRAWL_CONCURRENT_REQUESTS: "5"
      MAX_CONCURRENT_JOBS: "3"
      BROWSER_POOL_SIZE: "3"
      LOGGING_LEVEL: info
    depends_on:
      redis-search:
        condition: service_healthy
      firecrawl-postgres:
        condition: service_healthy
      firecrawl-rabbitmq:
        condition: service_healthy
      searxng:
        condition: service_healthy
      firecrawl-playwright:
        condition: service_started
    restart: unless-stopped
    networks:
      - search

  firecrawl-playwright:
    image: ghcr.io/firecrawl/playwright-service:latest
    container_name: axiom-firecrawl-playwright
    environment:
      PORT: "3000"
      ALLOW_LOCAL_WEBHOOKS: "false"
      BLOCK_MEDIA: "true"
      MAX_CONCURRENT_PAGES: "5"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    mem_limit: 2g
    tmpfs:
      - /tmp/.cache:noexec,nosuid,size=512m
    restart: unless-stopped
    networks:
      - search

  firecrawl-postgres:
    image: ghcr.io/firecrawl/nuq-postgres:latest
    container_name: axiom-firecrawl-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
    volumes:
      - axiom-firecrawl-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped
    networks:
      - search

  firecrawl-rabbitmq:
    image: rabbitmq:3-management
    container_name: axiom-firecrawl-rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "check_running"]
      interval: 5s
      timeout: 5s
      retries: 3
      start_period: 5s
    restart: unless-stopped
    networks:
      - search

  # Real-time Docker log viewer (localhost only). Shows all containers,
  # including the Langfuse compose project when it is running.
  dozzle:
    image: amir20/dozzle:latest
    container_name: axiom-dozzle
    ports:
      - "127.0.0.1:9999:8080"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    restart: unless-stopped

networks:
  search:
    driver: bridge

volumes:
  axiom-pgdata:
  axiom-firecrawl-pgdata:
  app_node_modules:
  app_next:
