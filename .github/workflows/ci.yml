name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Least privilege: every job gets a read-only token unless it grants more.
# The evals job declares its own scoped permissions (pull-requests: write
# for the eval-results PR comment), which fully overrides this block.
permissions:
  contents: read

env:
  NEXT_TELEMETRY_DISABLED: "1"
  # Date math in tests and builds resolves against one zone everywhere, not
  # whichever zone a runner image happens to ship with.
  TZ: "UTC"

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      # The integration suites hold the invariants a mock cannot: idempotency,
      # tenancy, version conflicts, the import's identity rules. Without a
      # database every one of them describe.skips, so the gate would report
      # green while proving nothing.
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: axiom
          POSTGRES_PASSWORD: axiom
          POSTGRES_DB: axiom_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U axiom"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://axiom:axiom@localhost:5432/axiom_test
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm
      # Incremental production-build state; scope both exact and fallback
      # restores to this ref to avoid another branch's compiled modules.
      - uses: actions/cache@v4
        with:
          path: .next/cache
          key: ${{ runner.os }}-next-${{ github.ref }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-next-${{ github.ref }}-${{ hashFiles('pnpm-lock.yaml') }}-
      - run: pnpm install --frozen-lockfile
      - name: Guard append-only migration checkpoints
        env:
          MIGRATION_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: pnpm check:migrations "$MIGRATION_BASE"
      # Applied directly, in journal order: drizzle-kit migrate has a
      # pre-existing identifier-truncation issue on the early migrations.
      - run: |
          for f in src/db/migrations/*.sql; do
            psql "$TEST_DATABASE_URL" -v ON_ERROR_STOP=1 -f "$f"
          done
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      # docs/generated/inventory.md is checked in and read as fact. If a schema,
      # route, tool, or outbox topic changed without regenerating it, the doc is
      # lying and this fails. Keep it next to `test`, before the slow build.
      - run: pnpm inventory:check
      - run: pnpm build
      # Next 16 dropped per-route First Load JS from the build table; this
      # restores the spec's JS-budget measurement from the build manifest.
      - run: node scripts/check-route-js.mjs
      # Schema drift gate: a domain schema edited without a generated
      # migration passes every other check here and breaks the next deploy or
      # migration replay. drizzle-kit generate never touches the database
      # (verified offline: a dead-endpoint DATABASE_URL generates cleanly), so
      # a port-closed dummy URL satisfies drizzle.config.ts's "must be set"
      # check — and if a drizzle-kit upgrade ever starts connecting, the dead
      # port fails fast instead of hanging the job.
      - name: Guard schema drift (domain schemas vs generated migrations)
        env:
          DATABASE_URL: postgresql://drizzle:unused@127.0.0.1:9/ci_generate_never_connects
        run: |
          generate_log="$(mktemp)"
          pnpm db:generate >"$generate_log" 2>&1 || {
            echo "::error::pnpm db:generate failed; the drift gate cannot run."
            tail -20 "$generate_log"
            exit 1
          }
          # drizzle-kit exits 0 even when a rename/create ambiguity needs an
          # interactive answer (CI has no TTY): it generates nothing and says
          # so only on stderr. The diff check below is the gate either way —
          # this keeps the silent no-op visible.
          if grep -q "Interactive prompts require a TTY" "$generate_log"; then
            echo "::warning::drizzle-kit needed an interactive rename/create answer and generated nothing; the drift check below ran against no fresh output. Resolve the pending question locally (pnpm db:generate in a terminal) and commit the result."
          fi
          # status --porcelain, not git diff: a brand-new migration file is
          # untracked, and diff alone would miss it.
          if [ -n "$(git status --porcelain -- src/db/migrations)" ]; then
            echo "::error::src/domains/*/schema.ts changed without a generated migration. Run 'pnpm db:generate' locally, commit the generated migration, and push."
            git status --porcelain -- src/db/migrations
            # Leave the tree as we found it: the generated output is the
            # author's to make locally, and later steps should not see it.
            git checkout -- src/db/migrations
            git clean -fdq src/db/migrations
            exit 1
          fi
      # Production boot smoke: e2e runs the dev server (the keyless dev-auth
      # design stands down under NODE_ENV=production), so the just-built
      # production app is booted nowhere. Start it here, wait for readiness,
      # and assert the public routes that exist render: /landing (the one
      # public marketing route) and /polymath (the anonymous-shell render of
      # the workspace front door, where / redirects). /sign-in and /sign-up
      # 404 by design until Clerk keys exist — a keyless CI boot cannot expect
      # 200 from them. Catches the "builds but doesn't boot" class before
      # Vercel does.
      - name: Production boot smoke (next start + real public routes)
        env:
          # The routes under test render without a database (the anonymous
          # shell path reads none); the URL keeps the server in the same env
          # shape the e2e job boots with, against this job's own service.
          DATABASE_URL: postgresql://axiom:axiom@localhost:5432/axiom_test
        run: |
          base="http://127.0.0.1:3000"
          log="$(mktemp)"
          # next start owns its process group via setsid, so the group kill
          # reaps pnpm, the sh wrapper, and the next-server child alike — no
          # orphaned listener for later steps.
          setsid pnpm start >"$log" 2>&1 &
          server_pid=$!
          cleanup() { kill -- -"$server_pid" 2>/dev/null || true; }
          trap cleanup EXIT
          ready=""
          for _ in $(seq 1 60); do
            if ! kill -0 "$server_pid" 2>/dev/null; then
              echo "::error::production server exited before becoming ready; log tail:"
              tail -40 "$log"
              exit 1
            fi
            code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 5 "$base/landing" || true)
            if [ "$code" = "200" ]; then ready=1; break; fi
            sleep 1
          done
          if [ -z "$ready" ]; then
            echo "::error::production server did not serve a 200 within 60s; log tail:"
            tail -40 "$log"
            exit 1
          fi
          fail=0
          for route in /landing /polymath; do
            code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 10 "$base${route}" || true)
            if [ "$code" != "200" ]; then
              echo "::error::GET ${route} returned ${code}, expected 200 — the production build does not boot clean."
              fail=1
            else
              echo "GET ${route} -> 200"
            fi
          done
          # The root entry is a config redirect to the workspace front door;
          # a broken redirect fails the boot as surely as a 500.
          code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 10 "$base/" || true)
          if [ "$code" != "307" ]; then
            echo "::error::GET / returned ${code}, expected the 307 redirect to /polymath."
            fail=1
          else
            echo "GET / -> 307 (redirects to /polymath)"
          fi
          if [ "$fail" != "0" ]; then
            tail -40 "$log"
            exit 1
          fi
          echo "Production boot smoke passed."

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      # 2-way shard of the main suite (Playwright splits the test files
      # across the legs). Legs are isolated runners - each gets its own
      # postgres service below and boots its own dev server - so a shard
      # shares nothing mutable with its sibling. fail-fast: false: a red
      # shard must not orphan the other's in-flight evidence; the artifact
      # uploads are always() for the same reason.
      matrix:
        shard: [1, 2]
    services:
      # The canonical routes read Postgres (identity resolution, run rows);
      # without a database the server renders error boundaries and the
      # journey tests would test the boundary, not the page.
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: axiom
          POSTGRES_PASSWORD: axiom
          POSTGRES_DB: axiom_e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U axiom"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://axiom:axiom@localhost:5432/axiom_e2e
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm
      # Next's dev server does not populate the production .next/cache path.
      # The chromium download is ~20s of every run; the OS deps step below is
      # a fast no-op once the image has them, and install skips what is cached.
      - uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('pnpm-lock.yaml') }}
      - run: pnpm install --frozen-lockfile
      # Canonical schema before the server starts: drizzle-kit migrate has a
      # pre-existing identifier-truncation issue on 0000-0002, so the SQL
      # files are applied directly, in journal order.
      - run: |
          for f in src/db/migrations/*.sql; do
            psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f "$f"
          done
      # Only chromium is configured; downloading the rest is wasted minutes.
      - run: pnpm exec playwright install --with-deps chromium
      # playwright.config.ts builds and starts the server itself. Each matrix
      # leg boots its own server and runs its shard of the suite; the fixture
      # env is unchanged from the pre-shard invocation.
      # PERF_BUDGET_ENFORCE turns the hero-route navigation budget from
      # reporting into a tripwire; the dev ceilings stay deliberately generous
      # (compile noise) and only catastrophic regressions fail.
      - run: pnpm exec playwright test --shard=${{ matrix.shard }}/2
        env:
          PERF_BUDGET_ENFORCE: "1"
          # The generation journeys (meeting prep, write from library,
          # proposal batches) click through the whole pipeline against the
          # deterministic fixture provider: no model key, no spend. Callers
          # the fixture does not know get the same unconfigured error as a
          # keyless run, treated as a skip.
          GENERATION_PROVIDER: fixture
          # The voice-capture journey transcribes through the deterministic
          # fixture adapter: no model key, no spend, no fake words in prod -
          # the seam is explicit opt-in everywhere (ASH-298).
          TRANSCRIPTION_PROVIDER: fixture
          # Lets a spec drain the outbox on purpose (one dispatcher pass)
          # instead of sleeping for a background worker that does not exist here.
          OUTBOX_DISPATCH_SECRET: e2e-outbox
          # The connectors tier journey's gateway leg (steps 3-4) mints a
          # gateway token for its seeded run with this value; the dev server
          # inherits the same step env, so both sides agree. Fixture value,
          # same standing as OUTBOX_DISPATCH_SECRET: the seeded account is a
          # fake gmail row and the within-tier call files a proposal for
          # review - nothing reaches a provider.
          EVE_GATEWAY_SECRET: e2e-gateway-secret-fixture-value-32chars
      # Structured record of the run above: names every test with its status,
      # including skips the list output never prints.
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: "e2e-report-${{ matrix.shard }}"
          retention-days: 14
          path: e2e-report.json
          if-no-files-found: warn
      # The Canva handoff's async journey (approve -> import_started -> sweep
      # -> terminal settle) runs in its own invocation against the explicit,
      # nonproduction-only import fixture: a global CANVA_IMPORT_PROVIDER
      # would mask the honest unconfigured-refusal journey above. Zero real
      # transport by construction - no Composio key exists here either.
      # --output matters: Playwright deletes the output directory when a run
      # starts, so a second invocation with the default test-results/ would
      # wipe the main run's pixel evidence before the upload steps below.
      # A sibling directory keeps both; the fixture's own screenshots are
      # cwd-relative and still land in test-results/feature-pixels/.
      # if: always() - the fixture journeys verify the async outcome workflow
      # and own no assertion outside their seeded rows; an unrelated main-suite
      # failure must not block their evidence (uploads below are always()
      # already). Their own failure still fails the job on its merits.
      # PLAYWRIGHT_JSON_OUTPUT_NAME keeps the fixture run's json report from
      # overwriting the main run's e2e-report.json in cwd.
      # De-serialized: pinned to shard 2's tail so it overlaps shard 1
      # instead of following the whole pool. The ASH-305 finding was about
      # the shutdown ritual's workspace writes, not canva's - and the legs
      # are isolated runners (own dev server, own postgres), so overlapped
      # canva journeys cannot touch shard 1's workspace at all. The
      # invocation's own failure still fails the job on its merits.
      - if: always() && matrix.shard == 2
        run: CANVA_IMPORT_PROVIDER=fixture GENERATION_PROVIDER=fixture OUTBOX_DISPATCH_SECRET=e2e-outbox PLAYWRIGHT_JSON_OUTPUT_NAME=e2e-report-fixture.json pnpm exec playwright test design-brief-canva-fixture --output=test-results-fixture
      # ASH-305: the shutdown ritual runs ALONE after the parallel suite. It
      # applies a real shutdown - parking captures, finishing sessions,
      # seeding tomorrow's list - in the one dev workspace every journey
      # shares; inside the parallel pool those writes destabilize unrelated
      # journeys (observed: meeting-prep, work-neon, calendar-conflicts on
      # every run that carried it, green on every run before it). It also
      # skips itself without SHUTDOWN_RITUAL_E2E, so the main run never
      # picks it up. Own --output dir: Playwright wipes it per invocation.
      # Un-sharded: pinned to shard 1 so it runs exactly once per workflow
      # run, still serial and alone on the workspace it writes to - each
      # leg owns its dev server and database, so the ritual cannot touch
      # the sibling leg's journeys.
      - if: always() && matrix.shard == 1
        run: SHUTDOWN_RITUAL_E2E=1 GENERATION_PROVIDER=fixture TRANSCRIPTION_PROVIDER=fixture OUTBOX_DISPATCH_SECRET=e2e-outbox PLAYWRIGHT_JSON_OUTPUT_NAME=e2e-report-shutdown.json pnpm exec playwright test shutdown-ritual --output=test-results-shutdown
      - uses: actions/upload-artifact@v7
        if: always() && matrix.shard == 1
        with:
          name: "e2e-report-shutdown-${{ matrix.shard }}"
          path: e2e-report-shutdown.json
          if-no-files-found: warn
          retention-days: 14
      # ASH-305 integration gate: real-route shutdown pixels (desktop form,
      # desktop done, mobile done) captured by tests/e2e/shutdown-ritual.spec.ts.
      - uses: actions/upload-artifact@v7
        if: always() && matrix.shard == 1
        with:
          name: "shutdown-real-route-pixels-${{ matrix.shard }}"
          retention-days: 14
          path: test-results-shutdown/**/shutdown-real-*.png
          if-no-files-found: warn
      # Failure forensics: Playwright's per-failure page snapshots and retry
      # traces. if: always(), not failure(): a journey that only passes on
      # retry is exactly the one whose first-attempt evidence must survive -
      # without these a green-with-retry run is a message, not evidence.
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: "e2e-error-context-${{ matrix.shard }}"
          retention-days: 14
          path: |
            test-results/**/error-context.md
            test-results-fixture/**/error-context.md
            test-results-shutdown/**/error-context.md
            test-results/**/trace.zip
            test-results-fixture/**/trace.zip
            test-results-shutdown/**/trace.zip
          if-no-files-found: ignore
      # The fixture invocation's own structured record: its journey results
      # (including skips) are evidence too, and the default report filename
      # would overwrite the main run's uploaded above. Only shard 2 runs
      # the fixture invocation, so only shard 2 has this report.
      - uses: actions/upload-artifact@v7
        if: always() && matrix.shard == 2
        with:
          name: "e2e-report-fixture-${{ matrix.shard }}"
          retention-days: 14
          path: e2e-report-fixture.json
          if-no-files-found: warn
      # Hydrated visual evidence for journeys that capture review pixels
      # (currently the bulk-complete specs); empty when none ran.
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: "bulk-complete-pixels-${{ matrix.shard }}"
          retention-days: 14
          path: test-results/bulk-pixels/
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: "onboarding-pixels-${{ matrix.shard }}"
          retention-days: 14
          path: test-results/onboarding-pixels/
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: "feature-pixels-${{ matrix.shard }}"
          retention-days: 14
          path: test-results/feature-pixels/
          if-no-files-found: ignore

  # Behavioral gate for the agent. The unit suite cannot see whether Polymath
  # actually reaches for the corpus before answering; these evals drive a real
  # turn against Gemini and fail the build when grounding regresses.
  #
  # Eval steps are skipped with a notice when the secret is absent. When it is
  # present, the strict eval run remains a required CI check and regressions fail.
  evals:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: check
    # The PR-comment step posts with the workflow token; everything else in
    # this job is read-only. Minimum grant, scoped to the job.
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Check the agent is runnable
        id: credential
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          if [ -z "$GEMINI_API_KEY" ]; then
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::warning::GEMINI_API_KEY is not set; agent evals were skipped, not run."
          else
            echo "present=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Run agent evals
        id: evals
        if: steps.credential.outputs.present == 'true'
        working-directory: eve/polymath
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_AGENT_MODEL: gemini-3.5-flash-lite
        # --strict turns soft thresholds into failures, so a score regression
        # blocks the merge instead of only showing in the artifact.
        # --json also prints the per-eval verdicts as one JSON document, which
        # the summary step below turns into the job table.
        run: |
          set +e
          ../../node_modules/.bin/eve eval --strict --json > "$RUNNER_TEMP/eval-report.json"
          status=$?
          cat "$RUNNER_TEMP/eval-report.json"
          exit $status
      # Surface the result where a reviewer looks first. The artifact has the
      # detail; this table answers "which eval failed, and how many gates did it
      # miss" without opening a download.
      - name: Eval results
        if: always() && steps.credential.outputs.present == 'true'
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: node .github/scripts/eval-summary.mjs "$RUNNER_TEMP/eval-report.json"
      # Keep the missing-secret state visible on main without failing the rest
      # of CI. The eval step above still runs and fails normally when configured.
      - name: Skip evals on main when Gemini key is missing
        if: github.ref == 'refs/heads/main' && steps.credential.outputs.present != 'true'
        run: echo "::notice::GEMINI_API_KEY is not set on main; agent evals were skipped."
      - name: Upload eval artifacts
        if: always() && steps.credential.outputs.present == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: eve-evals
          path: eve/polymath/.eve/evals/
          if-no-files-found: ignore
          retention-days: 14
      # Post the same table as a PR comment, replacing the previous one. The
      # marker lets the comment be found and deleted before the fresh post, so
      # a PR carries one live results thread instead of a stack per run. The
      # report file is re-rendered (not copied) because the job summary adds
      # GITHUB_STEP_SUMMARY noise the comment should not carry. Job summaries
      # still get the table; the comment is the PR-visible copy.
      - name: Post eval results as PR comment
        if: always() && steps.credential.outputs.present == 'true' && github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          # PR number comes from the event context expression — there is no
          # default GITHUB_EVENT_PULL_REQUEST_NUMBER env var; an empty value
          # would make the poster exit 2 on every PR.
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          node .github/scripts/eval-comment.mjs \
            "$RUNNER_TEMP/eval-report.json" \
            "$GITHUB_REPOSITORY" \
            "$PR_NUMBER"

  # Vercel deploys `main` through its own GitHub integration; every other branch
  # is disabled in vercel.json, so a merged PR is the only thing that ships.
  # Nothing is deployed from CI.
