name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # The build reads .node-version too; this keeps the runner honest if that
  # file is ever renamed.
  NODE_VERSION: "24"
  # Date math in tests and builds resolves against one zone everywhere, not
  # whichever zone a runner image happens to ship with.
  TZ: "UTC"

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      # The integration suites hold the invariants a mock cannot: idempotency,
      # tenancy, version conflicts, the import's identity rules. Without a
      # database every one of them describe.skips, so the gate would report
      # green while proving nothing.
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: axiom
          POSTGRES_PASSWORD: axiom
          POSTGRES_DB: axiom_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U axiom"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://axiom:axiom@localhost:5432/axiom_test
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .node-version
          cache: pnpm
      # Incremental Next build state; the full build below and the one inside
      # the e2e job both reuse it, so CI stops paying for two cold builds.
      - uses: actions/cache@v4
        with:
          path: .next/cache
          key: ${{ runner.os }}-next-${{ hashFiles('pnpm-lock.yaml') }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-next-${{ hashFiles('pnpm-lock.yaml') }}-
      - run: pnpm install --frozen-lockfile
      # Applied directly, in journal order: drizzle-kit migrate has a
      # pre-existing identifier-truncation issue on the early migrations.
      - run: |
          for f in src/db/migrations/*.sql; do
            psql "$TEST_DATABASE_URL" -v ON_ERROR_STOP=1 -f "$f"
          done
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

  e2e:
    runs-on: ubuntu-latest
    services:
      # The canonical routes read Postgres (identity resolution, run rows);
      # without a database the server renders error boundaries and the
      # journey tests would test the boundary, not the page.
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: axiom
          POSTGRES_PASSWORD: axiom
          POSTGRES_DB: axiom_e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U axiom"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://axiom:axiom@localhost:5432/axiom_e2e
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .node-version
          cache: pnpm
      - uses: actions/cache@v4
        with:
          path: .next/cache
          key: ${{ runner.os }}-next-${{ hashFiles('pnpm-lock.yaml') }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-next-${{ hashFiles('pnpm-lock.yaml') }}-
      # The chromium download is ~20s of every run; the OS deps step below is
      # a fast no-op once the image has them, and install skips what is cached.
      - uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('pnpm-lock.yaml') }}
      - run: pnpm install --frozen-lockfile
      # Canonical schema before the server starts: drizzle-kit migrate has a
      # pre-existing identifier-truncation issue on 0000-0002, so the SQL
      # files are applied directly, in journal order.
      - run: |
          for f in src/db/migrations/*.sql; do
            psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f "$f"
          done
      # Only chromium is configured; downloading the rest is wasted minutes.
      - run: pnpm exec playwright install --with-deps chromium
      # playwright.config.ts builds and starts the server itself.
      - run: pnpm e2e

  # Vercel deploys each branch as a preview through its own GitHub integration.
  # Nothing is deployed from CI — this job exists so the fact is visible here.
